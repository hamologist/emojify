[package]
name = "emojify-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "emojify-server"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8.6", features = ["macros"] }
hyper = { version = "1.7.0", features = ["full"] }
tokio = { version = "1.48.0", features = ["full", "rt-multi-thread"] }
emojify = { path = "../lib" }
